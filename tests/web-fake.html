<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Algebra Quest (fake cloud)</title>
  <!-- A check page: the online app with tests/fake-cloud.js in place of Firebase. Paths start at the app folder. -->
  <base href="../">
  <meta name="description" content="Algebra practice with lessons, streaks, and a leaderboard.">
  <meta name="theme-color" content="#6C4DF5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Algebra Quest">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.ico">
  <link rel="apple-touch-icon" href="img/icon-180.png">

<body>

  <script src="js/views.js"></script>
