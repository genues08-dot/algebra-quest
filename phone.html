<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Algebra Quest</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Phone build only. */
    .phone-note { text-align: center; color: #666; padding: 2rem 1rem; }
    .phone-toast {
      /* Above the tab bar, and taps go through it to the page. */
      position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); pointer-events: none;
      max-width: 22rem; width: calc(100% - 2rem); box-sizing: border-box;
      background: #2b2540; color: #fff; padding: 0.75rem 1rem; border-radius: 0.75rem;
      font-size: 0.95rem; line-height: 1.35; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      z-index: 1000;
    }
    .phone-toast[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="app"><p class="phone-note">Loading your progress…</p></div>
  <div class="phone-toast" id="phone-toast" role="status" aria-live="polite" hidden></div>

  <!-- Same app scripts as index.html. phone-boot.js starts the app instead of web-boot.js. -->
  <script src="js/checker.js"></script>
  <script src="js/mathexpr.js"></script>
  <script src="js/units.js"></script>
  <script src="js/plot.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/game.js"></script>
  <script src="js/rewards.js"></script>
  <script src="js/mascot.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/views.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/phone-units.js"></script>
  <script src="js/phone-boot.js"></script>
</body>
</html>
