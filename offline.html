<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Algebra Quest</title>
  <link rel="icon" href="icon.ico">
  <!-- The offline PC version was retired on 2026-11-13; the player moved to the online app with a new
       account. The pinned PC shortcut still opens this page from file://, so here it erases the old
       PC progress (only Algebra Quest's own keys) and opens the online app. On the website it just
       goes to the app. -->
  <script>
    (function () {
      var ONLINE = 'https://genues08-dot.github.io/algebra-quest/';
      if (location.protocol !== 'file:') {
        location.replace('./');
        return;
      }
      try {
        Object.keys(localStorage).forEach(function (key) {
          if (key.indexOf('algebraQuest.') === 0) localStorage.removeItem(key);
        });
      } catch (e) { /* storage blocked: nothing to erase */ }
      location.replace(ONLINE);
    })();
  </script>
</head>
<body>
  <p>Opening Algebra Quest&hellip; If nothing happens, <a href="https://genues08-dot.github.io/algebra-quest/">open it here</a>.</p>
</body>
</html>
